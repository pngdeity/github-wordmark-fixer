version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  triager:
    build: .
    command: node dist/distributed/triager.js
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - REPO_PATH=/app/repo
      - OTEL_SERVICE_NAME=file-triager
    volumes:
      - .:/app/repo
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    command: node dist/distributed/worker.js
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - REPO_PATH=/app/repo
      - OTEL_SERVICE_NAME=ml-worker
    volumes:
      - .:/app/repo
    depends_on:
      rabbitmq:
        condition: service_healthy

  patcher:
    build: .
    command: node dist/distributed/patcher.js
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
      - OTEL_SERVICE_NAME=file-patcher
    volumes:
      - .:/app/repo
    depends_on:
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
